<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OSISSMAILON</title>
  <style>
    body {
      margin: 0; background-color: #2e0854; color: #fff;
      font-family: 'Arial', sans-serif;
      overflow-x: hidden;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 20px; position: fixed; width: 100%; top: 0;
      background: rgba(75, 0, 130, 0.9); /* ungu tua transparan */
      z-index: 100;
    }
    header img {
      height: 50px;
    }
    #title {
      font-size: 28px;
      font-weight: bold;
    }
    main {
      padding-top: 80px;
      max-width: 1200px;
      margin: auto;
    }
    section.photos {
      margin-top: 40px;
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .photo {
      width: 30%;
      opacity: 0;
      transform: translateY(40px);
      transition: all 1s ease;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }
    .photo img {
      width: 100%; display: block;
      border-radius: 10px;
    }
    .photo.visible {
      opacity: 1;
      transform: translateY(0);
    }
    #maskots {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 40px;
    }
    .maskot {
      width: 150px;
      height: 150px;
      boundary-space: 10px;
      animation: float 4s ease-in-out infinite;
      cursor: pointer;
    }
    .maskot:nth-child(2) {
      animation-delay: 1.3s;
    }
    .maskot:nth-child(3) {
      animation-delay: 2.6s;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg);}
      50% { transform: translateY(-20px) rotate(10deg);}
    }
  </style>
</head>
<body>

<header>
  <img src="https://i.imgur.com/2jatxVH.png" alt="Logo Hijau SMA Islam NU Pujon" />
  <img src="https://i.imgur.com/jbWr7FE.png" alt="Logo OSIS" />
  <img src="https://i.imgur.com/boEQzcJ.png" alt="Logo SNU" />
</header>

<main>
  <h1 id="title" style="text-align:center;">OSISSMAILON</h1>

  <div id="maskots">
    <img src="https://i.imgur.com/noyvQqB.png" alt="Burung Maskot 1" class="maskot" />
    <img src="https://i.imgur.com/1UERX9Q.png" alt="Burung Maskot 2" class="maskot" />
    <img src="https://i.imgur.com/xNq5yjW.png" alt="Burung Maskot 3" class="maskot" />
  </div>

  <section class="photos">
    <div class="photo"><img src="https://i.imgur.com/5tiMPDZ.jpg" alt="Foto bersama OSIS 1" /></div>
    <div class="photo"><img src="https://i.imgur.com/pEwBpbS.jpg" alt="Foto bersama OSIS 2" /></div>
    <div class="photo"><img src="https://i.imgur.com/GVkBWVp.jpg" alt="Foto bersama OSIS 3" /></div>
  </section>
</main>

<script>
  // Animasi scroll membuat foto muncul saat di dalam viewport
  function showOnScroll() {
    const photos = document.querySelectorAll('.photo');
    const triggerBottom = window.innerHeight * 0.85;
    photos.forEach(photo => {
      const photoTop = photo.getBoundingClientRect().top;
      if(photoTop < triggerBottom) {
        photo.classList.add('visible');
      }
    });
  }
  window.addEventListener('scroll', showOnScroll);
  // Load inital check
  showOnScroll();
</script>

</body>
</html>
